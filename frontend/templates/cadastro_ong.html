<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de ONG</title>
</head>
<body>

<h1>Cadastro de ONG</h1>

<form id="formCadastroOng">
    <input type="text" id="nome" placeholder="Nome da ONG" required>
    <input type="text" id="cnpj" placeholder="CNPJ" required>
    <input type="text" id="endereco" placeholder="Endereço" required>
    <input type="text" id="contato" placeholder="Contato" required>
    <input type="password" id="senha" placeholder="Senha" required>

    <button type="submit">Cadastrar ONG</button>
</form>

<div id="mensagem"></div>

<script>
document.getElementById('formCadastroOng').addEventListener('submit', async function(e) {
    e.preventDefault();

    const mensagem = document.getElementById('mensagem');

    const data = {
        nome: document.getElementById('nome').value,
        cnpj: document.getElementById('cnpj').value,
        endereco: document.getElementById('endereco').value,
        contato: document.getElementById('contato').value,
        senha: document.getElementById('senha').value
    };

    try {
        const response = await fetch('/api/cadastro_ong', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
            mensagem.textContent = "ONG cadastrada com sucesso!";
            mensagem.style.color = "green";

            setTimeout(() => {
                window.location.href = "/login_ong";
            }, 1000);

        } else {
            mensagem.textContent = result.erro || "Erro ao cadastrar ONG";
            mensagem.style.color = "red";
        }

    } catch (err) {
        mensagem.textContent = "Erro de conexão com o servidor";
        mensagem.style.color = "red";
    }
});
</script>

</body>
</html>
