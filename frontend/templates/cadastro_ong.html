<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de ONG</title>
    <link rel="stylesheet" href="{{url_for('static', filename = 'cadastro_ong.css')}}">
</head>
<body>
<div class="main-wrapper">
    <div class="container">
        <h1>Cadastro de ONG</h1>
        <p class="subtitle">Cadastre sua instituição e ajude a transformar vidas. 🐾</p>

        <form id="formCadastroOng">
            <div class="form-group">
                <label for="nome">Nome da ONG:</label>
                <input type="text" id="nome" required placeholder="Nome da instituição">
            </div>

            <div class="form-group">
                <label for="cnpj">CNPJ:</label>
                <input type="text" id="cnpj" required placeholder="00.000.000/0000-00">
            </div>

            <div class="form-group">
                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" required placeholder="Rua, número, bairro">
            </div>

            <div class="form-group">
                <label for="contato">Contato:</label>
                <input type="text" id="contato" required placeholder="(00) 00000-0000">
            </div>

            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" required placeholder="Crie uma senha segura">
            </div>

            <div class="button-group">
                <button type="button" class="btn-back" onclick="window.history.back()">Voltar</button>
                <button type="submit" class="btn-next">Cadastrar ONG</button>
            </div>
            
            <div id="mensagem"></div>
        </form>
    </div>

    <div class="sidebar">
        <div class="logo-container">
            🐾 PETHOPE
        </div>
        <div class="dog-image-container">
            <img src="{{ url_for('static', filename='imagens/img_cadastro.jpg') }}" alt="Pets" class="pet-img">
        </div>
    </div>
</div>

<script>
document.getElementById('formCadastroOng').addEventListener('submit', async function(e) {
    e.preventDefault();
    const mensagem = document.getElementById('mensagem');
    const data = {
        nome: document.getElementById('nome').value,
        cnpj: document.getElementById('cnpj').value,
        endereco: document.getElementById('endereco').value,
        contato: document.getElementById('contato').value,
        senha: document.getElementById('senha').value
    };

    try {
        const response = await fetch('/api/cadastro_ong', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await response.json();
        if (response.ok) {
            mensagem.textContent = "ONG cadastrada com sucesso!";
            mensagem.style.color = "#27ae60";
            setTimeout(() => { window.location.href = "/login_ong"; }, 1000);
        } else {
            mensagem.textContent = result.erro || "Erro ao cadastrar ONG";
            mensagem.style.color = "#d9534f";
        }
    } catch (err) {
        mensagem.textContent = "Erro de conexão com o servidor";
        mensagem.style.color = "#d9534f";
    }
});
</script>

</body>
</html>
