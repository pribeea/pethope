<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Adotante | PetHope</title>

<style>
body { margin:0; font-family:Arial; background:#f4f6f8; }

header {
    background:#1976d2;
    color:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
}

.container { padding:30px; }

.card {
    background:white;
    padding:20px;
    margin:15px 0;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.btn {
    background:#1976d2;
    color:white;
    padding:10px;
    border-radius:5px;
    text-decoration:none;
}
</style>
</head>

<body>

<header>
    <h2>PetHope 🐾</h2>
    <a href="/logout" style="color:white;">Sair</a>
</header>

<div class="container">

    <h2>Bem-vindo, {{ nome }} 🐶</h2>

    <div class="card">
        <h3>🐾 Adotar um pet</h3>
        <p>Veja os animais disponíveis para adoção.</p>
        <a class="btn" href="#">Ver pets</a>
    </div>

    <div class="card">
        <h3>❤️ Favoritos</h3>
        <p>Veja os animais que você salvou.</p>
        <a class="btn" href="#">Ver favoritos</a>
    </div>

</div>

</body>
</html>
