<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login ONG | PetHope</title>
</head>
<body>

<h2>Login da ONG 🐶</h2>

<form id="loginOng">
    <input type="text" id="cnpj" placeholder="CNPJ" required>
    <input type="password" id="senha" placeholder="Senha" required>
    <button type="submit">Entrar</button>
    <p id="msg"></p>
</form>

<script>
document.getElementById('loginOng').addEventListener('submit', async (e) => {
    e.preventDefault();

    const response = await fetch('/api/login_ong', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            cnpj: document.getElementById('cnpj').value,
            senha: document.getElementById('senha').value
        })
    });

    const result = await response.json();

    if (response.ok) {
        window.location.href = '/dashboard_ong';
    } else {
        document.getElementById('msg').innerText = result.erro;
    }
});

</script>
</body>
</html>
