<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetHope - Cadastro de Usuário</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='cadastro.css') }}">
</head>
<body>

<div class="main-wrapper">
    <div class="sidebar">
        <div class="logo-container">
            🐾 PETHOPE
        </div>
        <div class="dog-image-container">
            <img src="{{ url_for('static', filename='imagens/img_cadastro.jpg') }}" alt="Pets" class="pet-img">
        </div>
    </div>

    <div class="container">
        <h1>Criar Conta</h1>
        <p class="subtitle">Bem-vindo ao PetHope! Garanta o melhor para os pets. 🐾</p>

        <form id="formCadastro">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required placeholder="exemplo@email.com">
            </div>

            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required minlength="6" placeholder="Mínimo 6 caracteres">
            </div>

            <div class="form-group">
                <label for="tipo">Tipo de Usuário:</label>
                <select id="tipo" name="tipo" required>
                    <option value="" disabled selected>Selecione uma opção...</option>
                    <option value="voluntario">Voluntário</option>
                    <option value="adotante">Adotante</option>
                    <option value="administrador">Administrador</option>
                </select>
            </div>

            <div class="button-group">
                <button type="button" class="btn-back" onclick="window.history.back()">Voltar</button>
                <button type="submit" class="btn-next">Cadastrar</button>
            </div>
            
            <div id="mensagem"></div>
        </form>
    </div>
</div>

<script>
document.getElementById('formCadastro').addEventListener('submit', async function(e) {
    e.preventDefault();
    const mensagemDiv = document.getElementById('mensagem');
    
    const data = {
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        senha: document.getElementById('senha').value,
        tipo: document.getElementById('tipo').value
    };

    try {
        const response = await fetch('/api/users', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        const result = await response.json();
        mensagemDiv.style.display = 'block';

        if (response.ok) {
            mensagemDiv.textContent = "Cadastro realizado! Redirecionando...";
            mensagemDiv.style.color = "#27ae60";
            setTimeout(() => { window.location.href = "/login"; }, 1000);
        } else {
            mensagemDiv.textContent = result.erro || "Erro ao cadastrar";
            mensagemDiv.style.color = "#d9534f";
        }
    } catch (err) {
        mensagemDiv.textContent = "Erro de conexão com o servidor";
        mensagemDiv.style.color = "#d9534f";
    }
});
</script>

</body>
</html>
