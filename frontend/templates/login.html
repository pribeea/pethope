<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetHope - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='cadastro.css') }}">
</head>
<body>

<div class="main-wrapper">
    <div class="sidebar">
        <div class="logo-container">
            🐾 PETHOPE
        </div>

        <div class="dog-image-container">
            <img src="{{ url_for('static', filename='imagens/img_login.png') }}"
                 alt="Pets"
                 class="pet-img">
        </div>
    </div>

    <div class="container">
        <h1>Entrar</h1>
        <p class="subtitle">
            Bem-vindo de volta ao PetHope! 🐾
        </p>

        <form id="formLogin">

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required placeholder="exemplo@email.com">
            </div>

            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password"
                       id="senha"
                       name="senha"
                       required
                       placeholder="Digite sua senha">
            </div>

            <div class="button-group">
                <button type="button"
                        class="btn-back"
                        onclick="window.location.href='/'">
                    Voltar
                </button>

                <button type="submit"
                        class="btn-next">
                    Entrar
                </button>
            </div>

            <div id="mensagem"></div>

        </form>
    </div>
</div>

<script>

    const form = document.getElementById('formLogin');
    const mensagem = document.getElementById('mensagem');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, senha })
            });

            const data = await response.json();

            if (response.ok) {

                mensagem.style.color = "#27ae60";
                mensagem.textContent = "Login realizado com sucesso!";

                setTimeout(() => {
                    window.location.href = "/dashboard";
                }, 1000);

            } else {

                mensagem.style.color = "#d9534f";
                mensagem.textContent = data.erro || "Email ou senha inválidos.";

            }

        } catch (erro) {

            mensagem.style.color = "#d9534f";
            mensagem.textContent = "Erro ao conectar ao servidor.";

        }
    });
    
</script>

</body>
</html>
